name: Wasm artifact gate

on:
  push:
    branches: [main]
    paths:
      - 'Fir/**'
      - 'Fir*.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'Makefile'
      - 'integration/talos/artifact/**'
      - 'integration/talos/**'
      - 'integration/package-tools/**'
      - 'tooling/**'
      - 'scripts/quiet-run.sh'
      - 'scripts/fir-lake-cache-path.sh'
      - 'integration/lcnf-c-wasm/setup-emscripten.sh'
      - 'integration/lcnf-c-wasm/toolchain-pins.sh'
      - '.github/workflows/wasm-artifact.yml'
  pull_request:
    paths:
      - 'Fir/**'
      - 'Fir*.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'Makefile'
      - 'integration/talos/artifact/**'
      - 'integration/talos/**'
      - 'integration/package-tools/**'
      - 'tooling/**'
      - 'scripts/quiet-run.sh'
      - 'scripts/fir-lake-cache-path.sh'
      - 'integration/lcnf-c-wasm/setup-emscripten.sh'
      - 'integration/lcnf-c-wasm/toolchain-pins.sh'
      - '.github/workflows/wasm-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-artifact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact:
    name: External tooling and deterministic W7 artifacts
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: 2
      FIR_WASM_JOBS: 2
      FIR_BINARYEN_DIR: ${{ github.workspace }}/.deps/lcnf-c-wasm/emsdk/upstream/bin
      TMPDIR: ${{ github.workspace }}/.deps/tmp
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Lean and local scratch prerequisites
        run: |
          mkdir -p "$TMPDIR" .deps
          sudo apt-get update
          sudo apt-get install -y ripgrep strace bubblewrap
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o .deps/elan-init.sh
          sh .deps/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare compatible file-access recorder
        run: bash scripts/quiet-run.sh ci-strace -- bash scripts/setup-ci-strace.sh
      - name: Prepare pinned Binaryen tools
        run: bash integration/lcnf-c-wasm/setup-emscripten.sh --runtime-profile unthreaded
      - name: Check external tooling on Node 22
        run: make tooling-check
      - name: Select Node 24 for baseline tooling and artifacts
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check external tooling on Node 24
        run: make tooling-check
      - name: Run deterministic artifact gate
        run: |
          git diff --check
          bash integration/talos/artifact/check.sh
      - name: Report bounded artifact failure logs
        if: failure()
        run: |
          mkdir -p .deps/ci-failure
          {
            count=0
            for log in _build/validation-v8/*/build*/stderr.log \
              _build/validation-v8/*/build*/stdout.jsonl \
              .deps/tool-logs/*.log; do
              if [[ ! -f "$log" || -L "$log" ]]; then continue; fi
              printf '\n--- %s (last 80 lines, at most 8192 bytes) ---\n' "$log"
              tail -n 80 "$log" | tail -c 8192
              count=$((count + 1))
              if (( count >= 12 )); then break; fi
            done
            if (( count == 0 )); then printf 'No artifact failure logs were produced.\n'; fi
          } | tee .deps/ci-failure/artifact.log
      - name: Upload bounded artifact failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-artifact-failure
          path: .deps/ci-failure/artifact.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
