name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      FIR_CHECK_JOBS: 2
      LEAN_NUM_THREADS: 2
      TMPDIR: ${{ github.workspace }}/.deps/tmp
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare worktree-local scratch
        run: mkdir -p "$TMPDIR"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install check dependencies
        run: |
          mkdir -p "$TMPDIR"
          sudo apt-get update
          sudo apt-get install -y ripgrep strace bubblewrap
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o .deps/elan-init.sh
          sh .deps/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Validate exact checkout
        run: |
          git diff --check
          make check

  talos:
    name: Talos proofs and trust audit
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: 2
      TMPDIR: ${{ github.workspace }}/.deps/tmp
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Lean
        run: |
          mkdir -p "$TMPDIR"
          sudo apt-get update
          sudo apt-get install -y ripgrep
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o .deps/elan-init.sh
          sh .deps/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Set up pinned Talos dependencies
        run: make talos-setup
      - name: Restore Mathlib build cache
        run: |
          LAKE_CACHE_DIR="$(bash scripts/fir-lake-cache-path.sh)"
          export LAKE_CACHE_DIR LAKE_ARTIFACT_CACHE=true LAKE_RESTORE_ARTIFACTS=true
          lake -d .deps/talos-434/project exe cache get
      - name: Check proofs and exact trust inventory
        run: make talos-check
      - name: Fetch immutable lean-zip proof input
        uses: actions/checkout@v6
        with:
          repository: ejgallego/lean-zip
          ref: 273d0d6cd9cab77c7f3489b0b0b1f6e543315d21
          path: .deps/retained-inputs/lean-zip
          persist-credentials: false
      - name: Fetch immutable zip-common proof input
        uses: actions/checkout@v6
        with:
          repository: ejgallego/lean-zip-common
          ref: 4425bab1f9522307d77e8d485bc536149ba31c36
          path: .deps/retained-inputs/zip-common
          persist-credentials: false
      - name: Check retained initializer and exact consumer trust inventories
        run: make retained-initializer-check
