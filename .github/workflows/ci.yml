name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      FIR_CHECK_JOBS: 2
      LEAN_NUM_THREADS: 2
      TMPDIR: ${{ github.workspace }}/.deps/tmp
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare worktree-local scratch
        run: mkdir -p "$TMPDIR"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install check dependencies
        run: |
          mkdir -p "$TMPDIR"
          sudo apt-get update
          sudo apt-get install -y ripgrep strace bubblewrap
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o .deps/elan-init.sh
          sh .deps/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare compatible file-access recorder
        run: bash scripts/quiet-run.sh ci-strace -- bash scripts/setup-ci-strace.sh
      - name: Validate exact checkout
        run: |
          git diff --check
          make check
      - name: Report bounded check failure logs
        if: failure()
        run: |
          mkdir -p .deps/ci-failure
          {
            count=0
            for log in _build/validation-v8/*/build*/stderr.log \
              _build/validation-v8/*/build*/stdout.jsonl \
              .deps/tool-logs/*.log; do
              if [[ ! -f "$log" || -L "$log" ]]; then continue; fi
              printf '\n--- %s (last 80 lines, at most 8192 bytes) ---\n' "$log"
              tail -n 80 "$log" | tail -c 8192
              count=$((count + 1))
              if (( count >= 12 )); then break; fi
            done
            if (( count == 0 )); then printf 'No check failure logs were produced.\n'; fi
          } | tee .deps/ci-failure/check.log
      - name: Upload bounded check failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-check-failure
          path: .deps/ci-failure/check.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  talos:
    name: Talos proofs and trust audit
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: 2
      TMPDIR: ${{ github.workspace }}/.deps/tmp
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Lean
        run: |
          mkdir -p "$TMPDIR"
          sudo apt-get update
          sudo apt-get install -y ripgrep
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o .deps/elan-init.sh
          sh .deps/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Set up pinned Talos dependencies
        run: make talos-setup
      - name: Restore Mathlib build cache
        run: |
          LAKE_CACHE_DIR="$(bash scripts/fir-lake-cache-path.sh)"
          export LAKE_CACHE_DIR LAKE_ARTIFACT_CACHE=true LAKE_RESTORE_ARTIFACTS=true
          lake -d .deps/talos-434/project exe cache get
      - name: Check proofs and exact trust inventory
        run: make talos-check
      - name: Check Blueprint source links and build documentation
        run: |
          python3 blueprint/test-source-links.py
          python3 blueprint/test-site.py
          make blueprint
          LAKE_CACHE_DIR="$(bash scripts/fir-lake-cache-path.sh)"
          export LAKE_CACHE_DIR LAKE_ARTIFACT_CACHE=true LAKE_RESTORE_ARTIFACTS=true
          lake -d blueprint exe vbp check --site blueprint/_out/site/html-multi
          python3 blueprint/check-site.py blueprint/_out/site/html-multi --base-path "/${GITHUB_REPOSITORY#*/}/"
      - name: Fetch immutable lean-zip proof input
        uses: actions/checkout@v6
        with:
          repository: ejgallego/lean-zip
          ref: 273d0d6cd9cab77c7f3489b0b0b1f6e543315d21
          path: .deps/retained-inputs/lean-zip
          persist-credentials: false
      - name: Fetch immutable zip-common proof input
        uses: actions/checkout@v6
        with:
          repository: ejgallego/lean-zip-common
          ref: 4425bab1f9522307d77e8d485bc536149ba31c36
          path: .deps/retained-inputs/zip-common
          persist-credentials: false
      - name: Check retained initializer and exact consumer trust inventories
        run: make retained-initializer-check
      - name: Upload checked Blueprint Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: blueprint/_out/site/html-multi

  pages:
    name: Deploy Blueprint to GitHub Pages
    needs: [check, talos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy checked Blueprint artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
