<!doctype html>
<html lang="en" data-result="running">
  <head>
    <meta charset="utf-8">
    <title>FIR lean-zip package smoke</title>
  </head>
  <body>
    <pre id="result">RUNNING</pre>
    <script type="module">
      import { fetchLeanZipStoredAdapter } from
        "./_build/lean-zip-stored-current/lean-zip-stored-browser-adapter.mjs";
      import { fetchLeanZipLevel1Adapter } from
        "./_build/lean-zip-level1-current/lean-zip-level1-browser-adapter.mjs";

      const output = document.querySelector("#result");
      try {
        const adapter = await fetchLeanZipStoredAdapter({
          wasmUrl: "./_build/lean-zip-stored-current/lean-zip-stored.wasm",
          descriptorUrl:
            "./_build/lean-zip-stored-current/lean-zip-stored.wasm.json",
        });
        const input = Uint8Array.of(0, 1, 127, 128, 255);
        const result = adapter.compressStored(input);
        const expected = Uint8Array.of(1, 5, 0, 250, 255,
          0, 1, 127, 128, 255);
        if (result.bytes.length !== expected.length ||
            !result.bytes.every((byte, index) => byte === expected[index])) {
          throw new Error(`unexpected stored result: ${result.bytes}`);
        }
        if (result.memory.frontierAfter !== result.memory.frontierBefore) {
          throw new Error("stored scratch checkpoint was not restored");
        }
        const level1 = await fetchLeanZipLevel1Adapter({
          wasmUrl: "./_build/lean-zip-level1-current/lean-zip-level1.wasm",
          descriptorUrl:
            "./_build/lean-zip-level1-current/lean-zip-level1.wasm.json",
        });
        if (level1.initialization.entry !== null ||
            level1.initialization.frontierGrowth !== 0) {
          throw new Error("Level-1 eagerly initialized a persistent cache");
        }
        const level1Input = Uint8Array.of(0, 1, 127, 128, 254, 255);
        const level1Result = level1.compressLevel1(level1Input);
        const level1Expected = Uint8Array.of(99, 96, 172, 111,
          248, 247, 31, 0);
        if (level1Result.bytes.length !== level1Expected.length ||
            !level1Result.bytes.every((byte, index) =>
              byte === level1Expected[index])) {
          throw new Error(`unexpected Level-1 result: ${level1Result.bytes}`);
        }
        if (level1Result.memory.frontierBefore !==
            level1.initialization.checkpoint) {
          throw new Error("Level-1 persistent checkpoint moved");
        }
        if (level1Result.memory.frontierAfter <
            level1Result.memory.frontierBefore) {
          throw new Error("Level-1 cache-aware rewind moved backwards");
        }
        const level1Warm = level1.compressLevel1(level1Input);
        if (level1Warm.memory.frontierBefore !==
              level1Result.memory.frontierAfter ||
            level1Warm.memory.frontierAfter !==
              level1Result.memory.frontierAfter) {
          throw new Error("Level-1 warm call did not rewind flat");
        }
        output.textContent = "PASS browser lean-zip stored + Level-1 packages";
        document.documentElement.dataset.result = "pass";
      } catch (error) {
        output.textContent = `FAIL ${error.stack ?? error}`;
        document.documentElement.dataset.result = "fail";
      }
    </script>
  </body>
</html>
