<!doctype html>
<html lang="en" data-result="running">
  <head>
    <meta charset="utf-8">
    <title>FIR Verso HTML package smoke</title>
  </head>
  <body>
    <pre id="result">RUNNING</pre>
    <script type="module">
      import {
        PrettyFormat as F,
        fetchPrettyMAdapter,
      } from "./_build/verso-html-current/prettyM-browser-adapter.mjs";

      const output = document.querySelector("#result");
      try {
        const adapter = await fetchPrettyMAdapter(
          "./_build/verso-html-current/prettyM.wasm");
        const result = adapter.render({
          format: F.tag(5, F.text('α<&"')),
          annotations: [{
            tag: 5,
            annotation: { cssClass: 'kw<&"', binding: 'b<&"' },
          }],
          width: 80,
          indent: 0,
          column: 0,
        });
        const expected = '<span class="kw&lt;&amp;&quot; token" ' +
          'data-binding="b&lt;&amp;&quot;">α&lt;&amp;&quot;</span>';
        if (result.html !== expected) {
          throw new Error(`unexpected HTML result: ${result.html}`);
        }
        output.textContent = "PASS browser HTML prettyM package";
        document.documentElement.dataset.result = "pass";
      } catch (error) {
        output.textContent = `FAIL ${error.stack ?? error}`;
        document.documentElement.dataset.result = "fail";
      }
    </script>
  </body>
</html>
