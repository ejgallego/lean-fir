name = "Fir"
version = "0.1.0"
defaultTargets = ["Fir"]

# Share content-addressed build products across same-toolchain lane worktrees.
# Keep the conventional build layout for validation scripts and external tools.
enableArtifactCache = true
restoreAllArtifacts = true

[[lean_lib]]
name = "Fir"

[[lean_exe]]
name = "fir-native-oracle"
root = "FirValidationNative"

[[lean_exe]]
name = "fir-direct-native"
root = "FirValidationDirectNative"

[[lean_exe]]
name = "fir-direct-lcnf"
root = "FirValidationDirectLCNF"

[[lean_exe]]
name = "fir-prettyM-artifact"
root = "FirPrettyMArtifactMain"
supportInterpreter = true
